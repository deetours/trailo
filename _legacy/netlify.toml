[build]
  publish = "."

# Ensure clean URLs and instant redirect for privacy policy
[[redirects]]
  from = "/privacy-policy/*"
  to = "/privacy-policy.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Optimize caching for static assets and images
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
